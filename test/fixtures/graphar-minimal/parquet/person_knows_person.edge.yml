src_type: person
edge_type: knows
dst_type: person
chunk_size: 2
src_chunk_size: 2
dst_chunk_size: 2
directed: true
prefix: edge/person_knows_person/
adj_lists:
  - ordered: true
    aligned_by: src
    file_type: parquet
  - ordered: true
    aligned_by: dst
    file_type: parquet
  - ordered: false
    aligned_by: src
    file_type: parquet
  - ordered: false
    aligned_by: dst
    file_type: parquet
property_groups:
  - file_type: parquet
    properties:
      - name: creationDate
        data_type: string
        is_primary: false
version: gar/v1
